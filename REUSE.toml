# Machine-readable licensing for every file (REUSE spec 3.3, https://reuse.software).
# Checked in CI with `reuse lint`. Later entries override earlier ones for the same path.
#
# Summary:
#   - Website code, build tools and docs: MIT (see LICENSE)
#   - Vivatheca 3D models, print files, renders and videos: CC BY-SA 4.0 (base meshes from
#     Z-Anatomy are CC BY-SA 4.0, so everything made from them stays CC BY-SA)
#     Exception: models built from BodyParts3D (CC BY 4.0), e.g. public/endodontic/ and public/tmd/, are CC BY 4.0
#   - Clinical images: each keeps its own licence, recorded with the image on its page
#     (see LICENSES/LicenseRef-Clinical-Image.txt and docs/image-licensing.md)
#   - Vendored third-party files keep their upstream licence
version = 1
SPDX-PackageName = "Vivatheca"
SPDX-PackageSupplier = "Vivatheca <vivatheca@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/CBCT-2026/Vivatheca"

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vivatheca"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["public/**/*.glb", "public/**/*.nvol", "public/**/*.stl", "public/**/*.3mf", "public/**/*.zip", "public/assets/renders/**", "public/videos/**", "public/**/*.webp", "public/**/*.mp4"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Vivatheca"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["review/layout-*/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Vivatheca"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["public/images/clinical/**"]
precedence = "override"
SPDX-FileCopyrightText = "See the attribution recorded with each image on its Vivatheca page"
SPDX-License-Identifier = "LicenseRef-Clinical-Image"

[[annotations]]
path = ["public/assets/australian-national-flag.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "Commonwealth of Australia"
SPDX-License-Identifier = "LicenseRef-Australian-Flag"

[[annotations]]
path = ["public/vendor/openseadragon/**"]
precedence = "override"
SPDX-FileCopyrightText = "OpenSeadragon contributors (openseadragon 6.1.1)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["public/vendor/annotorious/**"]
precedence = "override"
SPDX-FileCopyrightText = "Rainer Simon and Annotorious contributors (@annotorious/openseadragon 3.9.5)"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["public/development/vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = "Google LLC and the Draco authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["public/vendor/niivue/**"]
precedence = "override"
SPDX-FileCopyrightText = "NiiVue contributors (@niivue/niivue 0.69.0)"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = ["public/icons/health/**"]
precedence = "override"
SPDX-FileCopyrightText = "Health Icons contributors (healthicons.org, @healthicons/core 2.0.0)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["public/fonts/readable/atkinson-hyperlegible-*"]
precedence = "override"
SPDX-FileCopyrightText = "2020 Braille Institute of America, Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["public/fonts/readable/biz-udpgothic-*"]
precedence = "override"
SPDX-FileCopyrightText = "2022 The BIZ UDGothic Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["public/sw.js"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Vivatheca; Workbox runtime (c) Google LLC"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["public/models/averaged-jaw/**", "public/videos/averaged-jaw/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Vivatheca, derived from CC BY CT collections credited in provenance.json"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Endodontic pair and VPI models: built from BodyParts3D (DBCLS, CC BY 4.0), so these files are CC BY 4.0, not CC BY-SA.
[[annotations]]
path = ["public/endodontic/models/**", "public/endodontic/downloads/**", "public/assets/renders/endodontic.webp", "public/videos/endodontic/**", "public/prosthodontic/models/**", "public/prosthodontic/downloads/**", "public/assets/renders/prosthodontic.webp", "public/videos/prosthodontic/**", "public/vpi/models/**", "public/assets/renders/vpi.webp", "public/videos/vpi/**", "public/dentigerous-cyst/models/**", "public/dentigerous-cyst/downloads/**", "public/assets/renders/dentigerous-cyst.webp", "public/videos/dentigerous-cyst/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Vivatheca", "BodyParts3D, © The Database Center for Life Science licensed under CC Attribution 4.0 International"]
SPDX-License-Identifier = "CC-BY-4.0"

# TMD jaw joints and chewing muscles: built from BodyParts3D (DBCLS, CC BY 4.0) with muscles and discs made by Vivatheca, so CC BY 4.0.
[[annotations]]
path = ["public/tmd/models/**", "public/tmd/sheet/img/**", "public/assets/renders/tmd.webp", "public/videos/tmd/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Vivatheca", "BodyParts3D, © The Database Center for Life Science licensed under CC Attribution 4.0 International"]
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["public/head-neck/vendor/three/GLTFExporter.js"]
precedence = "override"
SPDX-FileCopyrightText = "three.js authors (three 0.147.0, examples/js/exporters/GLTFExporter.js)"
SPDX-License-Identifier = "MIT"
