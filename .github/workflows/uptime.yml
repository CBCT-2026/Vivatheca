name: Uptime

# Checks every 30 minutes that vivatheca.com answers. While the site password is on, the
# password prompt (401) counts as up. A failed run emails the repo owner (GitHub's default
# for failed scheduled workflows). Idea from Upptime (MIT), without a separate repo or server.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pages answer
        run: |
          fail=0
          for path in / /models /disclaimer /favicon.svg; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "https://vivatheca.com$path")
            echo "$path -> $code"
            case "$code" in 200|401) ;; *) fail=1 ;; esac
          done
          exit $fail
