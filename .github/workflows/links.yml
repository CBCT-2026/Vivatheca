name: Link check

# Free weekly check that cited sources and other links still work (lychee).
# Not run on every PR, because outside sites fail now and then; a broken link opens or updates an issue.
on:
  schedule:
    - cron: '0 21 * * 0' # Monday morning, Adelaide time
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 3
            --accept 200..=299,403,429
            --exclude '^https?://(localhost|127\.0\.0\.1)' --exclude 'vivatheca\.com'
            --exclude 'fonts\.(googleapis|gstatic)\.com' --exclude-path public/pagefind --exclude-path public/vendor
            'public/**/*.html' 'app/**/*.ts' 'app/**/*.tsx' 'docs/**/*.md' README.md AGENTS.md
      - name: Open or update one issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links found by the weekly link check"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue edit "$n" --body-file lychee/out.md; else gh issue create --title "$title" --body-file lychee/out.md; fi
