<!doctype html><html><head><style>html,body{margin:0;background:#EEFCFC}model-viewer{width:1536px;height:1024px;--poster-color:transparent}model-viewer::part(default-progress-bar){display:none}</style>
<script src="model-viewer-umd.js"></script></head><body>
<model-viewer id="m" src="impacted-molar.glb" interaction-prompt="none"></model-viewer>
<script>
const q=new URLSearchParams(location.search), m=document.getElementById('m');
for (const k of ['camera-orbit','camera-target','field-of-view','environment-image','exposure','shadow-intensity','shadow-softness','tone-mapping']) if(q.get(k)) m.setAttribute(k,q.get(k));
m.addEventListener('load',async()=>{
  const rough=q.get('rough'); if(rough) for(const mat of m.model.materials) mat.pbrMetallicRoughness.setRoughnessFactor(+rough);
  await new Promise(r=>setTimeout(r,1500)); document.title='ready';});
</script></body></html>
